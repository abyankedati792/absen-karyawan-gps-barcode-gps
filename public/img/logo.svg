<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512" role="img" aria-label="Logo PT. Shelter Indonesia">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f33"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <!-- latar -->
  <rect x="1" y="1" width="62" height="62" rx="17" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="16.5" fill="none" stroke="#ffffff" stroke-opacity=".18"/>

  <!-- motif QR di 3 sudut -->
  <g fill="#ffffff" fill-opacity=".92">
    <rect x="10" y="10" width="12" height="12" rx="3"/>
    <rect x="42" y="10" width="12" height="12" rx="3"/>
    <rect x="10" y="42" width="12" height="12" rx="3"/>
  </g>
  <g fill="#0b1f33">
    <rect x="14" y="14" width="4" height="4" rx="1"/>
    <rect x="46" y="14" width="4" height="4" rx="1"/>
    <rect x="14" y="46" width="4" height="4" rx="1"/>
  </g>
  <g fill="#ffffff" fill-opacity=".65">
    <rect x="42" y="42" width="4" height="4" rx="1"/>
    <rect x="48" y="42" width="4" height="4" rx="1"/>
    <rect x="42" y="48" width="4" height="4" rx="1"/>
    <rect x="48" y="48" width="4" height="4" rx="1"/>
  </g>

  <!-- pin lokasi ( GPS ) -->
  <path d="M32 17c-6.1 0-11 4.8-11 10.8 0 8.1 11 18.2 11 18.2s11-10.1 11-18.2C43 21.8 38.1 17 32 17z"
        fill="url(#pin)"/>
  <circle cx="32" cy="28" r="4.6" fill="#0b1f33"/>
  <circle cx="30.4" cy="26.4" r="1.5" fill="#ffffff" fill-opacity=".85"/>
</svg>
